name: Supabase keepalive

# A free Supabase project is paused after 7 days without activity. This does one cheap,
# authenticated REST read (anon key, row-level security applies, at most one row) so
# the project stays up while nobody uses the app.
#
# Runs twice a week: GitHub may delay or drop a scheduled run, and a single weekly run
# would sit exactly on the 7-day limit.
#
# This does NOT ping Render. Render services are meant to sleep (shared 750 h pool).
#
# Repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY. Without them the job skips.
# Note: GitHub disables scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read one row through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set; skipping."
            exit 0
          fi
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/cases?select=id&limit=1")
          echo "Supabase answered HTTP ${code}"
          case "$code" in
            2*) ;;
            *) echo "::error::keepalive read failed (HTTP ${code})"; exit 1 ;;
          esac
