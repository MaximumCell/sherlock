[project]
name = "sherlock-core"
version = "2.0.0"
description = "Shared models, storage, module registry and correlation engine for Sherlock"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "supabase>=2.10",
]

[project.optional-dependencies]
# heavy collector dependencies are only installed in the worker image
identity = ["user-scanner>=1.4.3", "dnspython>=2.7"]
infra = ["dnspython>=2.7"]
media = ["pillow>=11", "imagehash>=4.3"]
phone = ["phonenumbers>=8.13"]
# keyless web-search fallback of the name-search module `person_web` (see sherlock_core/search/keyless.py).
# The gateway installs it too, so module availability is judged the same way when a scan is planned.
search = ["ddgs>=9.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sherlock_core"]
