[project]
name = "sherlock-gateway"
version = "2.0.0"
description = "Sherlock API gateway: commands, validation, rate limits"
requires-python = ">=3.11"
dependencies = [
    "sherlock-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-genai>=0.3",
]

[tool.uv.sources]
sherlock-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
